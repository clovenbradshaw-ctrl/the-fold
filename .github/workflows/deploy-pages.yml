name: Deploy Pages

# Publishes the static build of The Fold to GitHub Pages (POLICIES.md P118).
#
# The build is deploy/build-site.mjs — the same build a terminal user, an
# archive.org pin or the browser extension use — so this workflow carries no
# path rewriting of its own. GitHub Pages serves static files only: every
# /api/* route (the record, the web organ, priors, GitHub, /run) is
# unavailable here and the page says so at boot (routes.js); chat works
# through the in-tab WebLLM rung, whose weights come from a mirror the site
# names (WEIGHTS_MIRROR below, an archive.org pin) or, failing that, from
# the model publisher — never from this repository: the shards are ~100 MB
# each and Pages holds a site under 1 GB.
#
# The engine is eoreader7 (its native tree, plus the frozen 6.1 cut it pins
# as a submodule), checked out beside the-fold exactly as ./fold lays it out.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # A weights mirror the page tries before the publisher (models/MIRRORS.json).
  # Leave empty to go straight to the publisher.
  WEIGHTS_MIRROR: ""

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the-fold
        uses: actions/checkout@v4
        with:
          path: the-fold

      - name: Checkout eoreader7 beside it (native tree + the frozen 6.1 submodule)
        uses: actions/checkout@v4
        with:
          repository: clovenbradshaw-ctrl/eoreader7
          path: eoreader7
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install the vendored packages the page loads
        working-directory: the-fold
        run: npm ci --ignore-scripts

      - name: Fetch pyodide's numpy/matplotlib/pandas wheels
        working-directory: the-fold
        run: sh scripts/fetch-pyodide-packages.sh

      - name: Assay the build first
        working-directory: the-fold
        run: node --test build-site.test.mjs routes.test.mjs webllm-rung.test.mjs

      - name: Build the static site
        working-directory: the-fold
        run: |
          set -e
          if [ -n "$WEIGHTS_MIRROR" ]; then node deploy/build-site.mjs --out _site --mirror "$WEIGHTS_MIRROR"; else node deploy/build-site.mjs --out _site; fi
          cat _site/BUILD.json

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: the-fold/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
