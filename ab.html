<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>The Fold — before / after</title>
    <style>
      /* A scratch harness, not part of the instrument: two live copies of the
         app side by side, the left one served from a detached worktree at the
         last commit and the right one from the working tree. Both are REAL —
         you can click through either. Delete this file and stop the :8817 /
         :8818 servers when the comparison has served its purpose. */
      :root {
        --bg: #ffffff; --panel: #fafafa; --ink: #111113; --muted: #5f5f68;
        --line: #dcdce3; --accent: #6d28d9; --accent-soft: #f3eeff;
        --sans: ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif;
        --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0f0f12; --panel: #15151a; --ink: #ecebf0; --muted: #9b9aa5;
          --line: #2b2b34; --accent: #a78bfa; --accent-soft: #1e1932;
        }
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        background: var(--bg); color: var(--ink);
        font: 400 14px/1.5 var(--sans);
        display: flex; flex-direction: column;
      }
      header {
        display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
        padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel);
      }
      h1 { margin: 0; font-size: 14px; font-weight: 700; color: var(--accent); }
      .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; padding: 2px; gap: 2px; }
      .seg button {
        font: inherit; border: 0; background: transparent; border-radius: 6px;
        padding: 4px 12px; font-size: 12.5px; color: var(--muted); cursor: pointer;
      }
      .seg button.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
      .seg button:hover:not(.on) { color: var(--ink); }
      .spacer { flex: 1; }
      .hint { font-size: 12px; color: var(--muted); }
      .hint code { font-family: var(--mono); font-size: 11.5px; }
      main { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--line); min-height: 0; }
      section { display: flex; flex-direction: column; min-width: 0; background: var(--bg); }
      .cap {
        display: flex; align-items: center; gap: 8px;
        padding: 6px 12px; font-size: 11px; font-family: var(--mono);
        letter-spacing: 0.06em; text-transform: uppercase;
        border-bottom: 1px solid var(--line); color: var(--muted); background: var(--panel);
      }
      .cap b { font-weight: 700; letter-spacing: 0.04em; }
      section.after .cap { color: var(--accent); }
      .cap .url { text-transform: none; letter-spacing: 0; opacity: 0.7; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      iframe { flex: 1; width: 100%; border: 0; background: var(--bg); min-height: 0; }
      .down { padding: 20px; font-size: 13px; color: var(--muted); }
      .down code { font-family: var(--mono); }
    </style>
  </head>
  <body>
    <header>
      <h1>before / after</h1>
      <div class="seg" id="screens"></div>
      <span class="spacer"></span>
      <span class="hint">Left is the app as it was before this pass. Right is the app now. Both are live — click either.</span>
    </header>
    <main>
      <section class="before">
        <div class="cap"><b>Before</b><span class="url" id="url-a"></span><span class="url">— last commit</span></div>
        <iframe id="a" title="before"></iframe>
      </section>
      <section class="after">
        <div class="cap"><b>After</b><span class="url" id="url-b"></span><span class="url">— this pass</span></div>
        <iframe id="b" title="after"></iframe>
      </section>
    </main>
    <script>
      // Each screen names the same view on both stacks. The chat page carries
      // its own Sources pane, and the BEFORE copy was pointed at :8818 so the
      // two halves never cross — a comparison that quietly showed the new
      // Explore inside the old chat would be worth nothing.
      var SRC = encodeURIComponent("the-fold/EXPLAINER.md");
      var PAGE = encodeURIComponent("the-fold/web/pages/8c1fd73e448da0a9.txt");
      var SCREENS = [
        { key: "chat", label: "Chat", a: "http://localhost:8817/", b: "http://localhost:8811/" },
        { key: "files", label: "Files", a: "http://localhost:8818/explore.html", b: "http://localhost:8812/explore.html" },
        { key: "source", label: "A source", a: "http://localhost:8818/explore.html?src=" + SRC, b: "http://localhost:8812/explore.html?src=" + SRC },
        { key: "page", label: "A saved page", a: "http://localhost:8818/explore.html?src=" + PAGE, b: "http://localhost:8812/explore.html?src=" + PAGE },
      ];
      var bar = document.getElementById("screens");
      function show(s) {
        for (var el of bar.children) el.className = el.dataset.key === s.key ? "on" : "";
        document.getElementById("a").src = s.a;
        document.getElementById("b").src = s.b;
        document.getElementById("url-a").textContent = s.a.replace("http://localhost", ":");
        document.getElementById("url-b").textContent = s.b.replace("http://localhost", ":");
        location.hash = s.key;
      }
      SCREENS.forEach(function (s) {
        var b = document.createElement("button");
        b.textContent = s.label;
        b.dataset.key = s.key;
        b.onclick = function () { show(s); };
        bar.appendChild(b);
      });
      var want = location.hash.slice(1);
      show(SCREENS.filter(function (s) { return s.key === want; })[0] || SCREENS[0]);
    </script>
  </body>
</html>
